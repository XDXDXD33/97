<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《偉大計劃》網頁對戰模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .card-hover {
            transition: all 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-gamepad text-amber-400 text-2xl font-bold"></i>
                    <span class="font-extrabold text-xl tracking-wider text-amber-400">《偉大計劃》對戰模擬器</span>
                    <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full hidden sm:inline-block">v2.2 介面分頁版</span>
                </div>
                <nav class="flex space-x-2">
                    <button id="nav-setup" onclick="switchTab('setup')" class="px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 transition flex items-center">
                        <i class="fa-solid fa-users-gear mr-1.5"></i>選角陣容
                    </button>
                    <button id="nav-arena" onclick="switchTab('arena')" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center">
                        <i class="fa-solid fa-swords mr-1.5"></i>對戰擂台
                    </button>
                    <button id="nav-codex" onclick="switchTab('codex')" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center">
                        <i class="fa-solid fa-book-bookmark mr-1.5"></i>圖鑑與技能
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">

        <!-- Tab 1: Character Selection Page (選角介面) -->
        <div id="tab-setup" class="space-y-6">
            <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-xl space-y-6">
                
                <!-- Setup Controls Header -->
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-700 pb-4">
                    <div class="flex items-center space-x-4">
                        <span class="text-sm font-bold text-amber-400 flex items-center">
                            <i class="fa-solid fa-sliders mr-2"></i>對戰模式設定：
                        </span>
                        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
                            <button onclick="changeBattleMode(1)" id="mode-1" class="px-3 py-1 text-xs rounded-md font-semibold text-slate-400 transition">1v1 單挑</button>
                            <button onclick="changeBattleMode(3)" id="mode-3" class="px-3 py-1 text-xs rounded-md font-semibold bg-amber-500 text-slate-950 transition">3v3 標準戰</button>
                            <button onclick="changeBattleMode(5)" id="mode-5" class="px-3 py-1 text-xs rounded-md font-semibold text-slate-400 transition">5v5 團體戰</button>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button onclick="randomizeTeams()" class="px-3 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition flex items-center shadow-md">
                            <i class="fa-solid fa-dice mr-1.5"></i>隨機配置陣容
                        </button>
                        <button onclick="startBattleAndSwitch()" class="px-5 py-2 text-sm font-extrabold bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 rounded-lg transition flex items-center shadow-lg transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-swords mr-2 text-base"></i>開始對戰 / 進入擂台
                        </button>
                    </div>
                </div>

                <!-- Team Selectors Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Alpha Team Setup -->
                    <div class="bg-slate-900/70 p-4 rounded-xl border border-blue-500/30 space-y-3 shadow-inner">
                        <div class="flex items-center justify-between border-b border-blue-500/20 pb-2">
                            <h3 class="font-extrabold text-blue-400 flex items-center text-sm">
                                <i class="fa-solid fa-shield-halved mr-2"></i>藍方 Alpha 隊伍配置
                            </h3>
                            <span class="text-[11px] text-blue-300/70">同隊不可重複選擇角色與副技能</span>
                        </div>
                        <div id="alpha-setup-slots" class="space-y-3"></div>
                    </div>

                    <!-- Beta Team Setup -->
                    <div class="bg-slate-900/70 p-4 rounded-xl border border-rose-500/30 space-y-3 shadow-inner">
                        <div class="flex items-center justify-between border-b border-rose-500/20 pb-2">
                            <h3 class="font-extrabold text-rose-400 flex items-center text-sm">
                                <i class="fa-solid fa-skull mr-2"></i>紅方 Beta 隊伍配置
                            </h3>
                            <span class="text-[11px] text-rose-300/70">同隊不可重複選擇角色與副技能</span>
                        </div>
                        <div id="beta-setup-slots" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Battle Arena Page (對戰介面) -->
        <div id="tab-arena" class="hidden space-y-6">

            <!-- Battle Control Bar -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-4 shadow-lg">
                <div class="flex items-center space-x-3">
                    <button onclick="switchTab('setup')" class="px-3 py-1.5 text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition flex items-center border border-slate-600">
                        <i class="fa-solid fa-chevron-left mr-1.5"></i>返回調整陣容
                    </button>
                    <button onclick="restartBattle()" class="px-4 py-1.5 text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg transition flex items-center shadow">
                        <i class="fa-solid fa-rotate-right mr-1.5"></i>滿血重置戰局
                    </button>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="stepTurn()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 font-semibold transition border border-slate-600 flex items-center" title="單步執行">
                        <i class="fa-solid fa-forward-step mr-1"></i>單步
                    </button>
                    <button id="btn-toggle-auto" onclick="toggleAutoPlay()" class="px-3.5 py-1.5 text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition flex items-center shadow">
                        <i class="fa-solid fa-pause mr-1.5" id="icon-auto"></i><span id="text-auto">暫停</span>
                    </button>
                    <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1">
                        <span class="text-[11px] text-slate-400 mr-1">速度:</span>
                        <select id="select-speed" onchange="setSpeed(this.value)" class="bg-transparent text-xs text-amber-400 font-bold focus:outline-none">
                            <option value="1000" class="bg-slate-900 text-slate-200">1x (慢)</option>
                            <option value="500" selected class="bg-slate-900 text-slate-200">2x (中)</option>
                            <option value="100" class="bg-slate-900 text-slate-200">10x (極速)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Rider Counters Bar (Dynamic) -->
            <div id="rider-counters-panel" class="hidden bg-slate-800 p-3 rounded-xl border border-amber-500/40 flex flex-wrap items-center justify-between text-xs gap-3 shadow-md">
                <span class="font-bold text-amber-400 flex items-center">
                    <i class="fa-solid fa-layer-group mr-2"></i> 假面騎士卡牌資源池狀態：
                </span>
                <div class="flex items-center space-x-4 font-mono text-sm">
                    <span class="text-rose-400 font-bold bg-slate-900/80 px-2 py-1 rounded border border-rose-500/30"><i class="fa-solid fa-heart mr-1"></i>紅心: <span id="cnt-hearts">0</span>/13</span>
                    <span class="text-slate-200 font-bold bg-slate-900/80 px-2 py-1 rounded border border-slate-500/30"><i class="fa-solid fa-spade mr-1"></i>黑桃: <span id="cnt-spades">0</span>/13</span>
                    <span class="text-amber-400 font-bold bg-slate-900/80 px-2 py-1 rounded border border-amber-500/30"><i class="fa-solid fa-diamond mr-1"></i>方塊: <span id="cnt-diamonds">0</span>/13</span>
                    <span class="text-emerald-400 font-bold bg-slate-900/80 px-2 py-1 rounded border border-emerald-500/30"><i class="fa-solid fa-clover mr-1"></i>梅花: <span id="cnt-clubs">0</span>/13</span>
                </div>
            </div>

            <!-- Battle Main Stage -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left 2 Cols: Fighters Status Grid -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Alpha Team Cards -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-between bg-blue-950/40 px-3 py-1.5 rounded-lg border border-blue-500/30">
                                <h4 class="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center">
                                    <i class="fa-solid fa-shield-halved mr-1.5"></i>Alpha 陣營即時狀態
                                </h4>
                            </div>
                            <div id="alpha-fighter-cards" class="space-y-3"></div>
                        </div>

                        <!-- Beta Team Cards -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-between bg-rose-950/40 px-3 py-1.5 rounded-lg border border-rose-500/30">
                                <h4 class="text-xs font-bold text-rose-400 uppercase tracking-wider flex items-center">
                                    <i class="fa-solid fa-skull mr-1.5"></i>Beta 陣營即時狀態
                                </h4>
                            </div>
                            <div id="beta-fighter-cards" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Right 1 Col: Combat Log -->
                <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-col h-[560px] shadow-xl">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-3">
                        <h3 class="font-bold text-sm text-slate-200 flex items-center">
                            <i class="fa-solid fa-scroll mr-2 text-amber-400"></i>對戰實況紀錄
                        </h3>
                    </div>
                    <div id="battle-log" class="flex-1 overflow-y-auto space-y-2 pr-2 text-xs font-mono custom-scrollbar">
                        <div class="text-slate-500 italic">點擊上方「開始對戰」啟動對戰實況...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: Codex & Skills -->
        <div id="tab-codex" class="hidden space-y-6">
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-wrap items-center justify-between gap-4">
                <div class="flex space-x-2">
                    <button onclick="switchCodexSubTab('chars')" id="subnav-chars" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950">角色圖鑑 (41)</button>
                    <button onclick="switchCodexSubTab('skills')" id="subnav-skills" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-700 text-slate-300">通用技能庫 (43)</button>
                </div>
                <input type="text" id="codex-search" oninput="renderCodex()" placeholder="搜尋角色/技能名稱或效果..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500 w-64">
            </div>

            <div id="codex-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

    </main>

            document.getElementById('tab-codex').classList.toggle('hidden', tab !== 'codex');

            alphaContainer.innerHTML = '';
            betaContainer.innerHTML = '';

            for (let i = 0; i < currentMode; i++) {
                alphaContainer.appendChild(createSlotEl('alpha', i));
                betaContainer.appendChild(createSlotEl('beta', i));
            }
            updateSelectOptions();

            div.innerHTML = `
                <div class="flex items-center justify-between text-xs">
                    <span class="font-bold text-slate-300 flex items-center">
                        <span class="w-2 h-2 rounded-full ${team === 'alpha' ? 'bg-blue-400' : 'bg-rose-400'} mr-2"></span>

                    </span>

                    </select>
                    <select id="${team}-skill-${idx}" onchange="onSlotChange()" class="bg-slate-900 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">

                </div>

            return div;
        }

        function updateSelectOptions() {
            for (let i = 0; i < currentMode; i++) {
                ['alpha', 'beta'].forEach(team => {
                    const charSel = document.getElementById(`${team}-char-${i}`);
                    const skillSel = document.getElementById(`${team}-skill-${i}`);
                    if (!charSel || !skillSel) return;

                    const curCharVal = charSel.value;
                    const curSkillVal = skillSel.value;

                    // Collect selected within team
                    const pickedChars = [];
                    const pickedSkills = [];
                    for (let j = 0; j < currentMode; j++) {
                        if (j !== i) {
                            const c = document.getElementById(`${team}-char-${j}`);
                            const s = document.getElementById(`${team}-skill-${j}`);
                            if (c && c.value) pickedChars.push(c.value);
                            if (s && s.value && s.value !== "無額外通用技能") pickedSkills.push(s.value);
                        }
                    }

                    // Populate Characters
                    charSel.innerHTML = RAW_CHARACTERS.map((c, idx) => {
                        const isPicked = pickedChars.includes(c.name);
                        const selected = (!curCharVal && idx === i % RAW_CHARACTERS.length) || curCharVal === c.name;
                        return `<option value="${c.name}" ${selected ? 'selected' : ''} ${isPicked ? 'disabled' : ''}>${c.name} ${isPicked ? '(隊內已選)' : ''}</option>`;
                    }).join('');

                    // Populate Skills
                    skillSel.innerHTML = RAW_SKILLS.map((s, idx) => {
                        const isPicked = pickedSkills.includes(s.name);
                        const selected = (!curSkillVal && idx === 0) || curSkillVal === s.name;
                        return `<option value="${s.name}" ${selected ? 'selected' : ''} ${isPicked ? 'disabled' : ''}>${s.name} ${isPicked ? '(隊內已選)' : ''}</option>`;
                    }).join('');

                    updateSlotPreview(team, i);
                });
            }
        }

        function onSlotChange() {
            updateSelectOptions();

        function updateSlotPreview(team, idx) {
            const charName = document.getElementById(`${team}-char-${idx}`).value;
            const skillName = document.getElementById(`${team}-skill-${idx}`).value;
            const charObj = RAW_CHARACTERS.find(c => c.name === charName);
            const skillObj = RAW_SKILLS.find(s => s.name === skillName);
            const infoEl = document.getElementById(`${team}-info-${idx}`);
            const previewEl = document.getElementById(`${team}-slot-${idx}-skill-preview`);

            if (charObj) {
                previewEl.innerText = `天生: ${charObj.skill}`;
                infoEl.innerHTML = `
                    <div class="flex justify-between font-mono text-slate-300">
                        <span>物:${charObj.phy} 魔:${charObj.mag} 防:${charObj.def} 速:${charObj.spd}</span>
                        <span class="text-amber-400 font-bold">${charObj.role}</span>
                    </div>
                    <div class="text-slate-400 mt-1 line-clamp-1" title="${charObj.desc}">${charObj.desc}</div>
                    ${skillObj && skillObj.name !== "無額外通用技能" ? `<div class="text-indigo-300 mt-1 font-semibold">【副】${skillObj.name}: ${skillObj.desc}</div>` : ''}
                `;
            }
        }

        function randomizeTeams() {
            ['alpha', 'beta'].forEach(team => {
                const shuffledChars = [...RAW_CHARACTERS].sort(() => 0.5 - Math.random());
                const shuffledSkills = [...RAW_SKILLS.filter(s => s.name !== "無額外通用技能")].sort(() => 0.5 - Math.random());

                for (let i = 0; i < currentMode; i++) {
                    const charSel = document.getElementById(`${team}-char-${i}`);
                    const skillSel = document.getElementById(`${team}-skill-${i}`);
                    if (charSel) charSel.value = shuffledChars[i].name;
                    if (skillSel) skillSel.value = Math.random() > 0.4 ? shuffledSkills[i].name : "無額外通用技能";
                }
            });
            updateSelectOptions();
        }

        // Core Combat Engine
        function createFighter(charObj, genericSkillName, team, id) {
            const maxHp = charObj.name === "防禦盾" ? 100 : 2000 + charObj.def * 100;
            return {
                id,
                name: charObj.name,
                team,
                role: charObj.role,
                phy: charObj.phy,
                mag: charObj.mag,
                def: charObj.def,
                spd: charObj.spd,
                intrinsicSkill: charObj.skill,
                intrinsicDesc: charObj.desc,
                genericSkill: genericSkillName,
                hp: maxHp,
                maxHp,
                lives: charObj.name === "謝新達" ? 2 : (charObj.name === "防禦盾" ? 10 : 1),
                transformed: false,
                tauntStacks: 0,
                statuses: {
                    burn: 0,
                    imprisoned: 0,
                    fear: 0,
                    weakness: 0,
                    disarm: 0,
                    taunt: 0,
                    shieldBreak: 0,
                    confidence: 0,
                    confusion: 0,
                    fatigue: 0,
                    damageDown: 0,
                    damageUp: 0
                },
                // Runtime values used by the expanded skill engine.
                crown: 0,
                strongAttack: 0,
                baseDamageMult: 1,
                pendingLethalImmune: false,
                damageTakenSinceL: 0,
                allInTriggered: false,
                comboChance: 0.0,
                skipBasicAttack: false,
                temporaryBuffs: {},
                roundsInBattle: 0
            };
        }

        function initializeSpecialFighterState(f) {
            if (!f) return f;
            if (f.name === "防禦盾") f.statuses.taunt = 999;
            if (f.name === "露娜") f.statuses.taunt = 999;
            if (f.name === "我是L") f.pendingLethalImmune = true;
            return f;
        }

            if (timerId) clearInterval(timerId);

            battleState.round = 1;
            battleState.turnIndex = 0;
            battleState.alpha = [];
            battleState.beta = [];
            battleState.cardCounters = { hearts: 0, spades: 0, diamonds: 0, clubs: 0 };

            for (let i = 0; i < currentMode; i++) {
                const aName = document.getElementById(`alpha-char-${i}`).value;
                const aSkill = document.getElementById(`alpha-skill-${i}`).value;
                const bName = document.getElementById(`beta-char-${i}`).value;
                const bSkill = document.getElementById(`beta-skill-${i}`).value;

                const aObj = RAW_CHARACTERS.find(c => c.name === aName);
                const bObj = RAW_CHARACTERS.find(c => c.name === bName);

                if (aObj) battleState.alpha.push(initializeSpecialFighterState(createFighter(aObj, aSkill, 'alpha', `a_${i}`)));
                if (bObj) battleState.beta.push(initializeSpecialFighterState(createFighter(bObj, bSkill, 'beta', `b_${i}`)));
            }

            battleState.fighters = [...battleState.alpha, ...battleState.beta];

            // Show Rider Counter Panel if any Kamen Rider is present
            const hasRider = battleState.fighters.some(f => f.name.includes("假面騎士"));
            document.getElementById('rider-counters-panel').classList.toggle('hidden', !hasRider);

            battleLogEl.innerHTML = '';
            logMsg(`<span class="text-amber-400 font-bold">⚔️ 《偉大計劃》對戰開始！ (${currentMode}v${currentMode})</span>`);

        // ===== Expanded skill engine helpers =====
        const STATUS_KEYS = ["burn","imprisoned","fear","weakness","disarm","taunt","shieldBreak","confidence","confusion","fatigue"];

        function teamOf(f) {
            return f.team === 'alpha' ? battleState.alpha : battleState.beta;
        }
        function enemiesOf(f) {
            return f.team === 'alpha' ? battleState.beta : battleState.alpha;
        }
        function alive(arr) { return arr.filter(x => x.hp > 0); }
        function randomAlive(arr) {
            const a = alive(arr);
            return a.length ? a[Math.floor(Math.random() * a.length)] : null;
        }
        function slowestAlly(f) {
            return alive(teamOf(f)).sort((a,b) => a.spd - b.spd)[0] || null;
        }
        function fastestAlly(f) {
            return alive(teamOf(f)).sort((a,b) => b.spd - a.spd)[0] || null;
        }
        function strongestPhysical(f) {
            return alive(teamOf(f)).sort((a,b) => b.phy - a.phy)[0] || null;
        }
        function strongestEnemyPhysical(f) {
            return alive(enemiesOf(f)).sort((a,b) => b.phy - a.phy)[0] || null;
        }
        function negativeCount(f) {
            return STATUS_KEYS.filter(k => (f.statuses[k] || 0) > 0).length;
        }
        function addStatus(target, key, turns=1, max=99) {
            if (!target || target.hp <= 0 || !(key in target.statuses)) return false;
            target.statuses[key] = Math.min(max, (target.statuses[key] || 0) + turns);
            return true;
        }
        function addAllNegative(target, turns=1) {
            ["burn","fear","weakness","disarm","imprisoned","taunt","shieldBreak","confusion","fatigue"].forEach(k => addStatus(target,k,turns));
        }
        function heal(target, amount, sourceName="") {
            if (!target || target.hp <= 0) return 0;
            const before = target.hp;
            target.hp = Math.min(target.maxHp, target.hp + Math.max(0, Math.floor(amount)));
            const gained = target.hp - before;
            if (gained > 0 && sourceName) logMsg(`  <span class="text-emerald-400">💚 ${sourceName} 為 ${target.name} 恢復 ${gained} 點生命！</span>`);
            return gained;
        }
        function dealRaw(attacker, target, amount, type="物理傷害", opts={}) {
            if (!target || target.hp <= 0) return 0;
            return applyDamage(attacker, target, amount, type, battleState, opts);
        }
        function triggerPassiveSkills(event, actor, target, context={}) {
            const fighters = battleState.fighters.filter(f => f.hp > 0);
            fighters.forEach(f => {
                if (f.genericSkill && f.genericSkill !== "無額外通用技能") {
                    executeGenericPassive(f, event, actor, target, context);
                }
            });
            fighters.forEach(f => {
                executeIntrinsicPassive(f, event, actor, target, context);
            });
        }
        function doChaseSkills(actor, target, context={}) {
            if (!actor || actor.hp <= 0 || !target || target.hp <= 0) return;
            executeGenericChase(actor, target, context);

        function performBasicAttack(f, target, allowChase=true) {
            if (!target || target.hp <= 0 || f.hp <= 0) return 0;
            if (f.statuses.disarm > 0) {
                logMsg(`  <span class="text-slate-400">🛑 ${f.name} 處於【繳械】，本回合無法普攻！</span>`);
                return 0;
            }
            if (f.statuses.confusion > 0 && Math.random() < 0.5) {
                // target was already resolved by getValidTarget; no extra reroll needed.
            }
            let base = Math.max(100, Math.max(f.phy, f.mag) * 50);
            base = Math.floor(base * (f.baseDamageMult || 1));
            if (f.statuses.damageUp > 0) base *= 2;
            if (f.statuses.damageDown > 0) base *= 0.8;
            const type = f.phy >= f.mag ? "物理傷害" : "魔法傷害";
            const dmg = dealRaw(f, target, base, type);
            triggerPassiveSkills("afterAttack", f, target, {damage:dmg});
            if (allowChase && target.hp > 0) doChaseSkills(f, target, {damage:dmg});
            return dmg;

        function chooseSkillTarget(f, preferEnemy=true) {

        function executeTurnSkill(f) {
            const s = f.genericSkill;

        function decrementStatuses() {
            battleState.fighters.forEach(f => {
                if (f.hp <= 0) return;
                ["imprisoned","fear","weakness","disarm","taunt","shieldBreak","confidence","confusion","damageDown","damageUp","fatigue"].forEach(k => {

                function applyDamage(attacker, defender, rawDmg, dmgType, battleState, opts={}) {
            if (!defender || defender.hp <= 0) return 0;

            // Passive defensive skills.
            if (defender.name === "牢大科比" && Math.random() < 0.5) {
                logMsg(`  <span class="text-emerald-400">⚡ ${defender.name} 觸發被動，完全免疫本次傷害！</span>`);
                return 0;
            }
            if (defender.name === "用覽趴共九陶" && Math.random() < 0.75) {
                logMsg(`  <span class="text-emerald-400">⚡ ${defender.name} 無視了本次傷害與控制！</span>`);
                return 0;
            }
            if (defender.genericSkill === "關我屁事阿" && Math.random() < 0.5) {
                logMsg(`  <span class="text-emerald-400">🛡️ ${defender.name} 觸發【關我屁事阿】，無視傷害！</span>`);
                return 0;
            }
            if (defender.pendingLethalImmune && rawDmg >= defender.hp) {
                defender.pendingLethalImmune = false;
                defender.hp = Math.max(1, Math.floor(defender.maxHp * 0.5));
                logMsg(`  <span class="text-emerald-400 font-bold">♟ ${defender.name} 觸發【我是L】的致命傷免疫！</span>`);
                return 0;
            }

            let defStat = opts.ignoreDefense ? 0 : (defender.statuses.shieldBreak > 0 ? 0 : defender.def);
            let finalDmg = Math.max(20, Math.floor(rawDmg - defStat * 15));

            if (defender.statuses.fear > 0) finalDmg = Math.floor(finalDmg * 1.2);
            if (defender.statuses.imprisoned > 0) finalDmg = Math.floor(finalDmg * 1.3);
            if (attacker && attacker.statuses.weakness > 0) finalDmg = Math.floor(finalDmg * 0.6);
            if (attacker && attacker.statuses.confidence > 0) finalDmg = Math.floor(finalDmg * 2.0);
            if (defender.statuses.damageDown > 0) finalDmg = Math.floor(finalDmg * 0.8);
            if (defender.name === "防禦盾") finalDmg *= 8;
            if (opts.multiplier) finalDmg = Math.floor(finalDmg * opts.multiplier);

            defender.hp -= finalDmg;
            defender.damageTakenSinceL = (defender.damageTakenSinceL || 0) + finalDmg;
            const teamObj = defender.team === 'alpha' ? battleState.alpha : battleState.beta;
            teamObj._roundDamage = (teamObj._roundDamage || 0) + finalDmg;

            logMsg(`  💥 <span class="${attacker ? (attacker.team === 'alpha' ? 'text-blue-400' : 'text-rose-400') : 'text-slate-400'}">${attacker ? attacker.name : '環境'}</span> 對 <span class="${defender.team === 'alpha' ? 'text-blue-400' : 'text-rose-400'}">${defender.name}</span> 造成 <span class="text-amber-400 font-bold">${finalDmg}</span> 點${dmgType}！`);

            triggerPassiveSkills("damaged", attacker, defender, {damage:finalDmg});
            checkKamenRiderCounters(defender, battleState);

            // Character-specific threshold passives.
            if (defender.name === "竹子" && finalDmg >= 500 && defender.hp > 0) {

            if (defender.name === "我是L" && defender.pendingLethalImmune === false) {
                defender.damageTakenSinceL = defender.damageTakenSinceL || 0;
            }
            if (defender.name === "晨晨" && defender.hp > 0 && attacker && attacker.team !== defender.team) {
                defender.mag += 200;
                const healTarget = randomAlive(teamOf(defender));
                if (healTarget) heal(healTarget, Math.floor(finalDmg * 0.7), "晨晨");
                enemiesOf(defender).filter(e=>e.hp>0).slice(0,1).forEach(e=>dealRaw(defender,e,Math.max(100,defender.mag),"晨晨反擊"));
                teamOf(defender).forEach(a=>a.spd = Math.floor(a.spd * 1.5));
                teamOf(defender).forEach(a=>STATUS_KEYS.forEach(k=>a.statuses[k]=0));
            }

            if (defender.hp <= 0) {
                if (defender.lives > 1) {
                    defender.lives--;
                    defender.hp = defender.maxHp;
                    logMsg(`  <span class="text-amber-400 font-bold">✨ ${defender.name} 倒下後復活！剩餘生命: ${defender.lives}</span>`);
                    if (defender.name === "謝新達") {

                    if (defender.name === "露娜") {

        }

        function getValidTarget(attacker, battleState) {
            const allies = attacker.team === 'alpha' ? battleState.alpha : battleState.beta;
            const enemies = attacker.team === 'alpha' ? battleState.beta : battleState.alpha;

            if (attacker.statuses.confusion > 0 && Math.random() < 0.5) {
                const aliveAllies = allies.filter(f => f.hp > 0 && f.id !== attacker.id);
                if (aliveAllies.length > 0) {

                    return aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
                }
            }

            const aliveEnemies = enemies.filter(f => f.hp > 0);
            if (aliveEnemies.length === 0) return null;

            const tauntingEnemy = aliveEnemies.find(e => e.statuses.taunt > 0);
            if (tauntingEnemy) return tauntingEnemy;

            return aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];

                function stepTurn() {
            if (isGameOver()) { checkGameOver(); return; }

            let queue = battleState.fighters.filter(f => f.hp > 0).sort((a,b)=>b.spd-a.spd);
            if (!queue.length) { checkGameOver(); return; }

            if (battleState.turnIndex >= queue.length) {
                battleState.turnIndex = 0;
                battleState.round++;
                battleState.fighters.forEach(f => { if(f.hp>0) f.roundsInBattle=(f.roundsInBattle||0)+1; });
                battleState.alpha._roundDamage=0;
                battleState.beta._roundDamage=0;
                logMsg(`<span class="text-slate-400 font-bold">--- 第 ${battleState.round} 回合開始 ---</span>`);
                processStartOfRoundSkills();
                if (isGameOver()) { checkGameOver(); return; }
                queue = battleState.fighters.filter(f => f.hp > 0).sort((a,b)=>b.spd-a.spd);
                if (!queue.length) return;
            }

            const currentFighter = queue[battleState.turnIndex++];
            if (currentFighter && currentFighter.hp > 0) {
                executeFighterTurn(currentFighter);
            }
            renderFighterCards();
            checkGameOver();
        }


                function processStartOfRoundSkills() {
            // Round-start damage/status processing.
            battleState.fighters.filter(f => f.hp > 0).forEach(f => {
                if (f.statuses.burn > 0) {
                    const burnDmg = Math.max(20, f.statuses.burn * Math.floor(Math.max(f.phy,f.mag) * 0.4));
                    f.hp -= burnDmg;
                    logMsg(`  <span class="text-orange-400">🔥 ${f.name} 受到 ${burnDmg} 點【焚燒】傷害！</span>`);

                if (f.genericSkill === "在將對方燒成灰燼前不會停下來的火焰") {

                return;
            }

            if (f.name === "國士無雙" && (f.roundsInBattle || 0) < 4) {

                f.roundsInBattle = (f.roundsInBattle || 0) + 1;

            }

            if (f.genericSkill && f.genericSkill !== "無額外通用技能") {
                const meta = RAW_SKILLS.find(x=>x.name===f.genericSkill);
                if (meta && meta.trigger === "主動") {
                    const t=chooseSkillTarget(f,true);
                    if(t) executeGenericSkill(f,t);
                }
            }

            // Intrinsic active skills.
            const target = getValidTarget(f, battleState);
            if (!target) return;
            const meta = RAW_CHARACTERS.find(c=>c.name===f.name);
            if (meta && meta.trigger === "主動") executeIntrinsicSkill(f,target);
            else if (!meta || !["被動","追擊","回合技"].includes(meta.trigger)) performBasicAttack(f,target);
            else performBasicAttack(f,target);

            if(f.name!=="謝羿捷" && f.genericSkill!=="ALL IN") return;
            if(f.hp<250 && alive(enemiesOf(f)).some(e=>e.hp<500) && !f.allInTriggered){
                f.allInTriggered=true;
                logMsg(`  <span class="text-rose-400 font-bold">🎰 ${f.name} 觸發【ALL IN】！</span>`);
                const t=getValidTarget(f,battleState);if(t)executeIntrinsicSkill(f,t);
                if(!alive(enemiesOf(f)).some(e=>e.hp<=0)) f.hp=0;
                f.allInTriggered=false;
            }
        }


        function isGameOver() {
            const alphaAlive = battleState.alpha.some(f => f.hp > 0);
            const betaAlive = battleState.beta.some(f => f.hp > 0);
            return !alphaAlive || !betaAlive;
        }

        function checkGameOver() {
            const alphaAlive = battleState.alpha.some(f => f.hp > 0);
            const betaAlive = battleState.beta.some(f => f.hp > 0);

            if (!alphaAlive || !betaAlive) {
                if (timerId) clearInterval(timerId);
                if (alphaAlive && !betaAlive) {
                    logMsg(`<div class="p-2 bg-blue-900/50 border border-blue-500 text-blue-300 font-bold text-center rounded mt-2">🏆 藍方 Alpha 隊伍 獲得最終勝利！</div>`);
                } else if (!alphaAlive && betaAlive) {
                    logMsg(`<div class="p-2 bg-rose-900/50 border border-rose-500 text-rose-300 font-bold text-center rounded mt-2">🏆 紅方 Beta 隊伍 獲得最終勝利！</div>`);
                } else {
                    logMsg(`<div class="p-2 bg-slate-800 border border-slate-600 text-slate-300 font-bold text-center rounded mt-2">🤝 雙方同歸於盡，平手！</div>`);
                }
            }
        }

        function runBattleLoop() {
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                if (isGameOver()) {
                    clearInterval(timerId);
                    return;
                }
                stepTurn();
            }, battleSpeed);
        }

        function toggleAutoPlay() {
            isAutoPlay = !isAutoPlay;
            document.getElementById('icon-auto').className = isAutoPlay ? "fa-solid fa-pause mr-1.5" : "fa-solid fa-play mr-1.5";
            document.getElementById('text-auto').innerText = isAutoPlay ? "暫停" : "繼續";
            if (isAutoPlay) runBattleLoop();
            else if (timerId) clearInterval(timerId);
        }

        function setSpeed(val) {
            battleSpeed = parseInt(val);
            if (isAutoPlay) runBattleLoop();
        }

        // Codex Rendering
        function renderCodex() {
            const container = document.getElementById('codex-grid');
            if (!container) return;
            const search = document.getElementById('codex-search').value.toLowerCase();
            container.innerHTML = '';

            RAW_CHARACTERS.filter(c => c.name.toLowerCase().includes(search) || c.desc.toLowerCase().includes(search)).forEach(c => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2 card-hover shadow";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <span class="font-bold text-amber-400">${c.name}</span>
                        <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">${c.role}</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1 text-center text-xs font-mono bg-slate-900 p-2 rounded">
                        <div>物:${c.phy}</div><div>魔:${c.mag}</div><div>防:${c.def}</div><div>速:${c.spd}</div>
                    </div>
                    <div class="text-xs text-slate-300"><span class="text-amber-300 font-bold">天生技: ${c.skill}</span> (${c.trigger})</div>
                    <div class="text-xs text-slate-400">${c.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        function switchCodexSubTab(tab) {
            document.getElementById('subnav-chars').className = tab === 'chars' ? "px-4 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950" : "px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-700 text-slate-300";
            document.getElementById('subnav-skills').className = tab === 'skills' ? "px-4 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950" : "px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-700 text-slate-300";
            renderCodex();
        }
    </script>
</body>
</html>
