<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偉大計劃 - 網頁對戰模擬器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        .hp-bar-fill {
            transition: width 0.3s ease-in-out, background-color 0.3s;
        }
        @keyframes pulse-highlight {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .active-turn {
            animation: pulse-highlight 1.5s infinite;
            border-color: #3b82f6 !important;
        }
        .tooltip-box {
            display: none;
            position: absolute;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }
        .has-tooltip:hover .tooltip-box {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-amber-500 to-red-600 text-white p-2 rounded-xl shadow-lg">
                    <i class="fa-solid font-bold fa-swords text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide bg-gradient-to-r from-amber-400 via-orange-300 to-red-400 bg-clip-text text-transparent">
                        偉大計劃 對戰模擬器
                    </h1>
                    <p class="text-xs text-slate-400">專屬角色與技能動態決鬥平台 (GitHub 完整版)</p>
                </div>
            </div>
            <nav class="flex items-center gap-2">
                <button onclick="switchTab('arena')" id="nav-arena" class="px-4 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition hover:bg-blue-500">
                    <i class="fa-solid fa-gamepad mr-1.5"></i>對戰擂台
                </button>
                <button onclick="switchTab('codex')" id="nav-codex" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-book mr-1.5"></i>圖鑑與技能
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 gap-6">

        <!-- TAB 1: ARENA (BATTLE SIMULATOR) -->
        <div id="tab-arena" class="space-y-6">
            
            <!-- Setup Panel -->
            <div id="setup-panel" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800">
                    <div>
                        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-users-gear text-amber-400"></i> 對陣陣容設定
                        </h2>
                        <p class="text-xs text-slate-400 mt-1">挑選登場角色與副技能，滑鼠懸停可開啟完整動態數值與技能說明。</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-xs text-slate-400 font-semibold">對戰模式：</label>
                        <select id="mode-select" onchange="changeBattleMode(this.value)" class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-3 py-1.5 font-medium text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="1">1 vs 1 單挑</option>
                            <option value="3" selected>3 vs 3 小隊戰</option>
                            <option value="5">5 vs 5 大混戰</option>
                        </select>
                        <button onclick="randomizeTeams()" class="bg-slate-800 hover:bg-slate-700 text-xs text-amber-300 font-semibold px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-dice"></i> 隨機陣容
                        </button>
                    </div>
                </div>

                <!-- Teams Picker Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Blue Team -->
                    <div class="bg-blue-950/20 border border-blue-900/40 rounded-xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-sm font-bold text-blue-400 flex items-center gap-2">
                                <i class="fa-solid fa-shield-halved"></i> 藍方隊伍 (Alpha)
                            </span>
                        </div>
                        <div id="blue-team-slots" class="space-y-4"></div>
                    </div>

                    <!-- Red Team -->
                    <div class="bg-red-950/20 border border-red-900/40 rounded-xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-sm font-bold text-red-400 flex items-center gap-2">
                                <i class="fa-solid fa-swords"></i> 紅方隊伍 (Beta)
                            </span>
                        </div>
                        <div id="red-team-slots" class="space-y-4"></div>
                    </div>
                </div>

                <!-- Action Button -->
                <div class="mt-6 flex justify-center">
                    <button onclick="startBattle()" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-lg rounded-xl shadow-lg shadow-orange-950/50 transition transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> 開 始 模 擬 對 戰
                    </button>
                </div>
            </div>

            <!-- Battle Arena Visuals & Controls -->
            <div id="battle-panel" class="hidden space-y-6">
                <!-- Control Bar -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
                    <div class="flex items-center gap-2">
                        <button id="btn-pause" onclick="togglePause()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            <i id="icon-pause" class="fa-solid fa-pause"></i> <span id="text-pause">暫停</span>
                        </button>
                        <button onclick="stepTurn()" id="btn-step" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-forward-step"></i> 單步執行
                        </button>
                        <button onclick="restartBattle()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-rotate-left"></i> 滿血重置對戰
                        </button>
                        <button onclick="returnToSetup()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-sliders"></i> 返回陣容調整
                        </button>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-slate-400 font-semibold">對戰速度：</span>
                            <button onclick="setSpeed(1000)" class="speed-btn px-2.5 py-1 text-xs rounded bg-blue-600 text-white font-bold" data-speed="1000">1x</button>
                            <button onclick="setSpeed(400)" class="speed-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-300 font-bold" data-speed="400">2x</button>
                            <button onclick="setSpeed(50)" class="speed-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-300 font-bold" data-speed="50">極速</button>
                        </div>
                        <div class="text-xs text-slate-400 font-mono">
                            回合: <span id="turn-counter" class="text-amber-400 font-bold">1</span>
                        </div>
                    </div>
                </div>

                <!-- Battle Field Visual Stage -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Blue Team Live Cards -->
                    <div class="bg-slate-900/90 border border-blue-900/30 rounded-2xl p-4 shadow-xl">
                        <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> 藍方陣營
                        </h3>
                        <div id="blue-field" class="space-y-3"></div>
                    </div>

                    <!-- Red Team Live Cards -->
                    <div class="bg-slate-900/90 border border-red-900/30 rounded-2xl p-4 shadow-xl">
                        <h3 class="text-xs font-bold text-red-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> 紅方陣營
                        </h3>
                        <div id="red-field" class="space-y-3"></div>
                    </div>
                </div>

                <!-- Combat Log Viewer -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col h-80">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                        <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check text-amber-400"></i> 對戰即時戰報 LOG
                        </span>
                        <button onclick="clearLog()" class="text-[11px] text-slate-500 hover:text-slate-300 transition">清空戰報</button>
                    </div>
                    <div id="combat-log" class="flex-1 overflow-y-auto custom-scrollbar font-mono text-xs space-y-1.5 pr-2"></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: CHARACTER & SKILL CODEX -->
        <div id="tab-codex" class="hidden space-y-6">
            <!-- Filter Bar -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <button onclick="toggleCodexSubtab('chars')" id="subtab-btn-chars" class="px-4 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950">
                        角色圖鑑 (<span id="char-count">0</span>)
                    </button>
                    <button onclick="toggleCodexSubtab('skills')" id="subtab-btn-skills" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-300">
                        通用技能庫 (<span id="skill-count">0</span>)
                    </button>
                </div>
                <input type="text" id="codex-search" oninput="filterCodex()" placeholder="搜尋名稱、定位或技能..." class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500 w-64">
            </div>

            <!-- Characters Grid -->
            <div id="codex-chars-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <!-- Skills Grid -->
            <div id="codex-skills-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </main>

        // Helper to generate non-repeating character and skill selections per team
        function generateUniqueSetup(count) {
            const setup = [];
            const usedChars = new Set();
            const usedSkills = new Set();

            for (let i = 0; i < count; i++) {
                // Find unused character
                let charIdx;
                let attempts = 0;
                do {
                    charIdx = Math.floor(Math.random() * RAW_CHARACTERS.length);
                    attempts++;
                } while (usedChars.has(charIdx) && attempts < 100);
                usedChars.add(charIdx);

                // Find unused skill (or -1)
                let skillIdx = -1;
                if (Math.random() > 0.4) {
                    let skillAttempts = 0;
                    do {
                        skillIdx = Math.floor(Math.random() * RAW_SKILLS.length);
                        skillAttempts++;
                    } while (usedSkills.has(skillIdx) && skillAttempts < 100);
                    if (skillAttempts < 100) usedSkills.add(skillIdx);
                    else skillIdx = -1;
                }

                setup.push({ charIndex: charIdx, skillIndex: skillIdx });
            }
            return setup;
        }

            document.getElementById('combat-log').innerHTML = '';
            document.getElementById('turn-counter').innerText = 1;

            logEvent(`⚔️ <b>對戰開始！</b> 藍方 (${blueTeam.length}人) VS 紅方 (${redTeam.length}人)`, 'text-amber-400 font-bold border-b border-slate-800 pb-1');

            isPaused = false;
            updatePauseUI();
            renderBattlefield();
            runBattleLoop();
        }

        // Restart current battle with all characters restored to 100% full health and fresh status
        function restartBattle() {
            if (battleTimer) clearTimeout(battleTimer);
            startBattle();
        }

        function returnToSetup() {
            if (battleTimer) clearTimeout(battleTimer);
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('battle-panel').classList.add('hidden');
        }

        function togglePause() {
            isPaused = !isPaused;
            updatePauseUI();
            if (!isPaused && !battleState.isFinished) runBattleLoop();
        }

        function updatePauseUI() {
            document.getElementById('icon-pause').className = isPaused ? "fa-solid fa-play" : "fa-solid fa-pause";
            document.getElementById('text-pause').innerText = isPaused ? "繼續" : "暫停";
        }

        function setSpeed(ms) {
            battleSpeed = ms;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.className = parseInt(btn.dataset.speed) === ms 
                    ? "speed-btn px-2.5 py-1 text-xs rounded bg-blue-600 text-white font-bold"
                    : "speed-btn px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-300 font-bold";
            });
        }

        function runBattleLoop() {
            if (isPaused || battleState.isFinished) return;
            stepTurn();
            if (!battleState.isFinished && !isPaused) {
                battleTimer = setTimeout(runBattleLoop, battleSpeed);
            }
        }

        function stepTurn() {
            if (battleState.isFinished) return;

            if (battleState.turnQueue.length === 0) {
                const alive = battleState.fighters.filter(f => f.isAlive);
                const blueAlive = alive.some(f => f.team === 'blue');
                const redAlive = alive.some(f => f.team === 'red');

                if (!blueAlive || !redAlive) {
                    battleState.isFinished = true;
                    const winner = blueAlive ? "藍方 (Alpha)" : "紅方 (Beta)";
                    logEvent(`🏆 <b>對戰結束！勝利者為：<span class="${blueAlive ? 'text-blue-400' : 'text-red-400'}">${winner}</span>！</b>`, 'text-amber-300 font-black text-sm py-2 border-t border-b border-amber-500/30 my-2');
                    renderBattlefield();
                    return;
                }

                alive.sort((a, b) => b.spd - a.spd || (Math.random() - 0.5));
                battleState.turnQueue = alive;
                battleState.roundDamageTaken = 0;
                document.getElementById('turn-counter').innerText = battleState.turn;
                logEvent(`--- <b>第 ${battleState.turn} 回合開始</b> ---`, 'text-slate-400 text-[11px] font-bold mt-2');
                
                processTurnStartSkills();
            }

            if (battleState.turnQueue.length > 0) {
                const currentFighter = battleState.turnQueue.shift();
                if (currentFighter.isAlive) {
                    battleState.activeFighterId = currentFighter.id;
                    executeFighterTurn(currentFighter);
                }
            }

            if (battleState.turnQueue.length === 0) {
                checkRoundEndTriggers();
                battleState.turn++;
            }

            renderBattlefield();
        }

        function processTurnStartSkills() {
            battleState.fighters.filter(f => f.isAlive).forEach(f => {
                // Burn Damage
                if (f.statuses.burn > 0) {
                    const burnDmg = Math.floor((f.phy + f.mag) * 20 * f.statuses.burn);
                    f.hp = Math.max(0, f.hp - burnDmg);
                    logEvent(`🔥 [${f.name}] 受到【焚燒】傷害 ${burnDmg} 點！`, 'text-orange-400');
                    if (f.hp <= 0) checkDeath(f);
                }

                // 喝酒司機 Turn Start
                if (f.isAlive && f.name === '喝酒司機') {
                    const roll = Math.random();
                    if (roll < 0.20) {
                        f.hp = 0;
                        logEvent(`🍺 [喝酒司機] 猝死！`, 'text-red-500 font-bold');
                        checkDeath(f);
                    } else if (roll < 0.50) {
                        f.statuses.imprisoned = 1;
                        logEvent(`🚨 [喝酒司機] 酒駕被捕進入【監禁】！`, 'text-amber-400 font-bold');
                    } else {
                        f.statuses.confidence = 2;
                        logEvent(`💪 [喝酒司機] 獲得酒精自信 (傷害200%)！`, 'text-emerald-400 font-bold');
                    }
                }

                // CAS Monster Opening Strike
                if (f.isAlive && f.name === '凱斯芒斯特(CAS Monster)') {
                    const aliveEnemies = battleState.fighters.filter(e => e.team !== f.team && e.isAlive);
                    if (aliveEnemies.length > 0) {
                        logEvent(`🚀 [CAS Monster] 開局發射 6 枚 Kh-38MT 飛彈飽和打擊！`, 'text-amber-400 font-bold');
                        for(let i = 0; i < 6; i++) {
                            // 動態重新過濾存活敵方目標，避免攻擊已死亡對象
                            const currentEnemies = battleState.fighters.filter(e => e.team !== f.team && e.isAlive);
                            if (currentEnemies.length === 0) break;
                            
                            const target = currentEnemies[Math.floor(Math.random() * currentEnemies.length)];
                            if (target && target.isAlive) {
                                if (Math.random() < 0.8) {
                                    target.hp = 0;
                                    logEvent(`💥 飛彈直擊！[${target.name}] 直接被摧毀！`, 'text-red-500 font-bold');
                                    checkDeath(target, f);
                                } else {
                                    target.statuses.disarm = 1;
                                    target.statuses.hardCC = 1;
                                    logEvent(`💥 飛彈轟炸！[${target.name}] 遭到繳械與強行封鎖！`, 'text-orange-400');
                                }
                            }
                        }
                    }
                }
            });
        }

        // 取得合法的存活目標（優先處理嘲諷，自動排除已死亡角色）
        function getValidTarget(attacker) {
            const aliveEnemies = battleState.fighters.filter(f => f.team !== attacker.team && f.isAlive);
            if (aliveEnemies.length === 0) return null;
            
            const tauntTarget = aliveEnemies.find(e => e.statuses.taunt);
            if (tauntTarget) return tauntTarget;

            return aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        }

        function checkRoundEndTriggers() {
            // 戰斬 Round End Counter
            if (battleState.roundDamageTaken >= 1000) {
                battleState.fighters.filter(f => f.isAlive && f.name === '戰斬').forEach(zz => {
                    const enemies = battleState.fighters.filter(e => e.team !== zz.team && e.isAlive);
                    if (enemies.length > 0) {
                        logEvent(`⚔️ [戰斬] 觸發【焙樋咎逝鷂樋茴覷】！團隊累積受傷過千，展開強烈反擊！`, 'text-red-400 font-bold');
                        enemies.forEach(e => {
                            if (e.isAlive) applyDamage(zz, e, 400, 'physical');
                        });
                    }
                });
            }
        }

        function executeFighterTurn(attacker) {
            if (!attacker.isAlive) return;

            if (attacker.statuses.imprisoned > 0) {
                logEvent(`⛓️ [${attacker.name}] 處於【監禁】狀態，無法行動！`, 'text-purple-400 font-bold');
                attacker.statuses.imprisoned--;
                return;
            }

            if (attacker.statuses.hardCC > 0) {
                logEvent(`🌀 [${attacker.name}] 處於控制狀態，無法行動！`, 'text-purple-400');
                attacker.statuses.hardCC--;
                return;
            }

            // 取得存活敵人
            let target = getValidTarget(attacker);
            if (!target) return;

            if (attacker.name === '陳星偉') {
                attacker.stacks.damageBoost *= 1.5;
                logEvent(`📈 [陳星偉] 力量膨脹，傷害疊加至 ${attacker.stacks.damageBoost.toFixed(2)}x！`, 'text-amber-400');
            }

            const useSkill = Math.random() < 0.6;

            if (useSkill && attacker.intrinsicSkill) {
                executeSkill(attacker, target, attacker.intrinsicSkill);
            } else {
                if (attacker.statuses.disarm > 0) {
                    logEvent(`🚫 [${attacker.name}] 處於繳械狀態，無法進行普通攻擊！`, 'text-slate-400');
                    attacker.statuses.disarm--;
                } else {
                    let rawDmg = (attacker.phy * 40 + 100) * attacker.stacks.damageBoost;
                    if (attacker.statuses.weakness > 0) rawDmg *= 0.6;
                    if (attacker.statuses.confidence > 0) rawDmg *= 2.0;

                    const dealt = applyDamage(attacker, target, rawDmg, 'physical');
                    logEvent(`⚔️ [${attacker.name}] 對 [${target.name}] 普通攻擊，造成 ${dealt} 點傷害！`, attacker.team === 'blue' ? 'text-blue-300' : 'text-red-300');
                }
            }

            if (attacker.isAlive && attacker.extraSkill && Math.random() < 0.45) {
                // 再次確保目標存活
                let skillTarget = getValidTarget(attacker);
                if (skillTarget) {
                    logEvent(`🔮 [${attacker.name}] 發動副技能【${attacker.extraSkill.name}】！`, 'text-cyan-400');
                    executeGenericSkill(attacker, skillTarget, attacker.extraSkill);
                }
            }
        }

        function applyDamage(attacker, defender, rawDmg, type = 'physical') {
            // 若防守者已死亡，不執行傷害與判定
            if (!defender || !defender.isAlive) return 0;

            if (defender.name === '牢大科比' && Math.random() < 0.5) {
                logEvent(`🛡️ [牢大科比] 發動【牢大想你了】，完美閃避攻擊！`, 'text-emerald-400');
                return 0;
            }
            if (defender.name === '用覽趴共九陶' && Math.random() < 0.75) {
                logEvent(`💪 [用覽趴共九陶] 無視了本次攻擊與控制！`, 'text-emerald-400');
                return 0;
            }

            let defFactor = defender.statuses.shieldBreak > 0 ? 0 : (defender.def * 15);
            let finalDmg = Math.max(20, Math.floor(rawDmg - defFactor));

            if (defender.name === '防禦盾') finalDmg *= 8;
            if (defender.statuses.imprisoned > 0) finalDmg = Math.floor(finalDmg * 1.3);
            if (defender.statuses.fear > 0) finalDmg = Math.floor(finalDmg * 1.2);

            defender.hp -= finalDmg;
            battleState.roundDamageTaken += finalDmg;

            // Trigger 竹子 Passive
            if (defender.name === '竹子' && finalDmg >= 500 && attacker && attacker.isAlive) {
                logEvent(`🎋 [竹子] 觸發「蔓延」反傷！對 [${attacker.name}] 造成 200 點傷害並施加【虛弱】！`, 'text-emerald-400');
                attacker.statuses.weakness = 2;
                applyDamage(defender, attacker, 200, 'physical');
            }

            // Trigger 晨晨 Passive Counter
            if (defender.team !== attacker?.team) {
                const chenchen = battleState.fighters.find(f => f.team === defender.team && f.isAlive && f.name === '晨晨');
                if (chenchen && attacker && attacker.isAlive) {
                    chenchen.mag += 200;
                    const healAmt = Math.floor(finalDmg * 0.7);
                    logEvent(`⚡ [晨晨] 觸發被動【靠我力量】！魔攻提升 200，對全隊施加速拉條並解控！`, 'text-emerald-300 font-bold');
                    const allies = battleState.fighters.filter(a => a.team === chenchen.team && a.isAlive);
                    allies.forEach(a => {
                        a.spd = Math.floor(a.spd * 1.5);
                        a.statuses.imprisoned = 0;
                        a.statuses.hardCC = 0;
                        a.statuses.burn = 0;
                        if (a.statuses.imprisoned === 0) a.hp = Math.min(a.maxHp, a.hp + healAmt);
                    });
                }
            }

            if (defender.hp <= 0) {
                checkDeath(defender, attacker);
            }

            return finalDmg;
        }

        function checkDeath(fighter, killer = null) {
            if (fighter.lives > 1) {
                fighter.lives--;
                fighter.hp = fighter.maxHp;
                
                if (fighter.name === '謝新達') {
                    fighter.phy *= 2;
                    const enemies = battleState.fighters.filter(e => e.team !== fighter.team && e.isAlive);
                    enemies.forEach(e => e.statuses.disarm = 1);
                    logEvent(`✨ [謝新達] 豬大哥沒死！變身「中華民國總統」，物理攻擊翻倍，敵方全體繳械 1 回合！`, 'text-amber-300 font-bold');
                } else {
                    logEvent(`✨ [${fighter.name}] 復活！剩餘生命：${fighter.lives}`, 'text-emerald-300 font-bold');
                }
                return;
            }

            fighter.hp = 0;
            fighter.isAlive = false;

            // 清空所有負面狀態與效果
            for (let key in fighter.statuses) {
                if (typeof fighter.statuses[key] === 'boolean') {
                    fighter.statuses[key] = false;
                } else {
                    fighter.statuses[key] = 0;
                }
            }
            fighter.stacks.damageBoost = 1.0;
            fighter.stacks.crown = 0;

            logEvent(`💀 [${fighter.name}] 陣亡離場！`, 'text-red-500 font-bold');

            if (fighter.name === '露娜') {
                const flamePunch = battleState.fighters.find(f => f.name === '炎拳' && f.isAlive);
                if (flamePunch) {
                    flamePunch.phy += fighter.phy;
                    flamePunch.mag += fighter.mag;
                    flamePunch.def += fighter.def;
                    flamePunch.spd += fighter.spd;
                    logEvent(`🌟 [露娜] 獻祭自己，將全屬性轉移給【炎拳】！`, 'text-amber-300 font-bold');
                }
            }
        }

        function executeSkill(user, target, skill) {
            // 重新檢索確保目標依然存活
            if (!target || !target.isAlive) {
                target = getValidTarget(user);
                if (!target) return;
            }

            let dmg = 0;
            switch(user.name) {
                case '柯文哲':
                    dmg = applyDamage(user, target, 500, 'magical');
                    target.statuses.shieldBreak = 2;
                    target.statuses.breachCount = (target.statuses.breachCount || 0) + 1;
                    logEvent(`⚖️ [柯文哲] 施展【民進黨才是共匪】，造成 ${dmg} 點魔傷、破盾並給予 1 層【背信罪】！`, 'text-amber-400 font-bold');
                    if (target.statuses.breachCount >= 2) {
                        target.statuses.breachCount = 0;
                        target.statuses.imprisoned = 2;
                        logEvent(`⛓️ [柯文哲] 發動【監禁】！使 [${target.name}] 進入監禁狀態 2 回合！`, 'text-red-400 font-black');
                    }
                    break;
                case '消波塊':
                    const chunkDmg = Math.floor(target.hp * 0.8);
                    target.hp -= chunkDmg;
                    logEvent(`🧱 [消波塊] 施展【裡面的人】，對 [${target.name}] 造成 80% 現有血量 (${chunkDmg} 點) 重創！`, 'text-amber-400 font-bold');
                    battleState.fighters.filter(e => e.team !== user.team && e.isAlive).forEach(e => e.statuses.imprisoned = 1);
                    user.hp = 0;
                    user.isAlive = false;
                    logEvent(`🧱 [消波塊] 將對方全體監禁 1 回合後自我下場！`, 'text-purple-400 font-bold');
                    break;
                case 'Chance':
                    const roll = Math.random();
                    if (roll < 0.0001) {
                        logEvent(`✨ [Chance] 觸發 0.01% 極限神蹟！我方直接宣告勝利！`, 'text-amber-300 font-black text-base');
                        battleState.fighters.filter(f => f.team !== user.team).forEach(f => f.hp = 0);
                    } else if (roll < 0.25) {
                        dmg = applyDamage(user, target, 500, 'magical');
                        logEvent(`🎲 [Chance] 叮！對 [${target.name}] 造成 500 點魔法打擊！`, 'text-amber-400');
                    } else {
                        target.statuses.weakness = 2;
                        logEvent(`🎲 [Chance] 叮！使 [${target.name}] 進入虛弱狀態！`, 'text-amber-400');
                    }
                    break;
                case '炎拳':
                    if (user.statuses.burn > 0) {
                        dmg = applyDamage(user, target, (user.phy + user.mag) * 60, 'hybrid');
                        user.def = 0;
                        logEvent(`🔥 [炎拳] 爆發炎拳巨額傷害 ${dmg} 點！自身防禦歸零！`, 'text-orange-400 font-bold');
                    } else {
                        user.statuses.burn = Math.min(5, user.statuses.burn + 1);
                        logEvent(`🔥 [炎拳] 進入【焚燒】狀態！`, 'text-orange-300');
                    }
                    break;
                case '黃伯超':
                    dmg = applyDamage(user, target, user.phy * 120, 'physical');
                    target.statuses.shieldBreak = 2;
                    logEvent(`👊 [黃伯超] 發動【超派鐵拳】，造成 ${dmg} 點穿防傷害！`, 'text-orange-500 font-bold');
                    break;
                case '薩恩':
                    const aliveAllies = battleState.fighters.filter(f => f.team === user.team && f.isAlive && f.id !== user.id);
                    if (aliveAllies.length > 0) {
                        const victim = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
                        
                        // 繼承隊友數值
                        user.phy += victim.phy;
                        user.mag += victim.mag;
                        user.def += victim.def;
                        user.spd += victim.spd;
                        
                        // 替換天生技能
                        const oldSkillName = user.intrinsicSkill.name;
                        user.intrinsicSkill = { ...victim.intrinsicSkill };

                        // 處死隊友
                        victim.hp = 0;
                        victim.isAlive = false;

                        logEvent(`🗡️ [薩恩] 發動【神罰「炎拳」】，強行處死隊友 [${victim.name}]！`, 'text-red-400 font-bold');
                        logEvent(`⚡ [薩恩] 繼承其屬性 (物+${victim.phy}, 魔+${victim.mag}, 防+${victim.def}, 速+${victim.spd})，並將天生技能【${oldSkillName}】替換為【${user.intrinsicSkill.name}】！`, 'text-amber-300 font-bold');
                        
                        checkDeath(victim, user);
                    } else {
                        dmg = applyDamage(user, target, (user.phy + user.mag) * 45 + 150, 'magical');
                        logEvent(`✨ [薩恩] (無可處死隊友) 發動魔法攻擊，對 [${target.name}] 造成 ${dmg} 點傷害！`, 'text-cyan-300');
                    }
                    break;
                case '家暴王':
                    target.statuses.shieldBreak = 2;
                    dmg = applyDamage(user, target, user.phy * 70, 'physical');
                    logEvent(`💥 [家暴王] 發動【家暴神拳】，造成 ${dmg} 傷害並【破盾】！`, 'text-red-400');
                    break;
                case '陳米荻':
                    dmg = applyDamage(user, target, 300, 'magical');
                    user.hp = Math.min(user.maxHp, user.hp + 600);
                    logEvent(`🐱 [陳米荻] 可愛地喵了一聲！造成 ${dmg} 傷害並回復 600 點生命值！`, 'text-emerald-300');
                    break;
                default:
                    dmg = applyDamage(user, target, (user.phy + user.mag) * 45 + 150, 'magical');
                    logEvent(`✨ [${user.name}] 發動技能【${skill.name}】，對 [${target.name}] 造成 ${dmg} 點傷害！`, 'text-cyan-300');
                    break;
            }
        }

        function executeGenericSkill(user, target, skill) {
            if (skill.desc.includes('回復') || skill.desc.includes('治療')) {
                const allies = battleState.fighters.filter(f => f.team === user.team && f.isAlive);
                const lowest = allies.sort((a,b) => (a.hp/a.maxHp) - (b.hp/b.maxHp))[0];
                if (lowest && lowest.statuses.imprisoned === 0) {
                    lowest.hp = Math.min(lowest.maxHp, lowest.hp + 250);
                    logEvent(`💚 [${user.name}] 使用【${skill.name}】為 [${lowest.name}] 恢復 250 HP！`, 'text-emerald-400');
                }
            } else {
                const dmg = applyDamage(user, target, 200 + user.mag * 35, 'magical');
                logEvent(`💥 [${user.name}] 發動【${skill.name}】，對 [${target.name}] 造成 ${dmg} 點傷害！`, 'text-indigo-300');
            }
        }

        function renderBattlefield() {
            const renderCards = (team, elementId) => {
                const container = document.getElementById(elementId);
                container.innerHTML = '';
                
                team.forEach(f => {
                    const hpPercent = Math.max(0, Math.floor((f.hp / f.maxHp) * 100));
                    const isActive = f.id === battleState.activeFighterId && f.isAlive;
                    
                    let hpColor = "bg-emerald-500";
                    if (hpPercent < 50) hpColor = "bg-amber-500";
                    if (hpPercent < 20) hpColor = "bg-red-500";

                    const card = document.createElement('div');
                    card.className = `bg-slate-800/90 border-2 ${isActive ? 'active-turn border-blue-500' : (f.isAlive ? 'border-slate-700' : 'border-slate-800 opacity-50')} rounded-xl p-3 transition shadow-md`;
                    
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs ${f.isAlive ? 'text-slate-100' : 'text-slate-500 line-through'}">${f.name}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-amber-300 font-semibold">${f.role}</span>
                                ${f.lives > 1 ? `<span class="text-[10px] text-emerald-400 font-bold">❤️ x${f.lives}</span>` : ''}
                            </div>
                            <span class="text-[11px] font-mono text-slate-400">${f.hp} / ${f.maxHp} HP</span>
                        </div>
                        
                        <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden mb-2 border border-slate-700/50">
                            <div class="hp-bar-fill h-full ${hpColor}" style="width: ${hpPercent}%"></div>
                        </div>

                        <div class="flex items-center justify-between text-[11px] text-slate-400 font-mono">
                            <span>物:${f.phy} | 魔:${f.mag} | 防:${f.def} | 速:${f.spd}</span>
                            <div class="flex items-center gap-1">
                                ${f.statuses.imprisoned > 0 ? `<span class="text-purple-400 font-bold" title="監禁">⛓️</span>` : ''}
                                ${f.statuses.burn > 0 ? `<span class="text-orange-400 font-bold" title="焚燒">🔥${f.statuses.burn}</span>` : ''}
                                ${f.statuses.fear > 0 ? `<span class="text-purple-300 font-bold" title="恐懼">😱</span>` : ''}
                                ${f.statuses.weakness > 0 ? `<span class="text-amber-400 font-bold" title="虛弱">📉</span>` : ''}
                                ${f.statuses.disarm > 0 ? `<span class="text-red-400 font-bold" title="繳械">🚫</span>` : ''}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            };

            renderCards(battleState.blueTeam, 'blue-field');
            renderCards(battleState.redTeam, 'red-field');
        }

        function logEvent(msg, styleClass = 'text-slate-300') {
            const container = document.getElementById('combat-log');
            const div = document.createElement('div');
            div.className = styleClass;
            div.innerHTML = msg;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearLog() {
            document.getElementById('combat-log').innerHTML = '';
        }

        function initCodex() {
            document.getElementById('char-count').innerText = RAW_CHARACTERS.length;
            document.getElementById('skill-count').innerText = RAW_SKILLS.length;
            renderCodex();
        }

        function toggleCodexSubtab(type) {
            document.getElementById('codex-chars-grid').classList.toggle('hidden', type !== 'chars');
            document.getElementById('codex-skills-grid').classList.toggle('hidden', type !== 'skills');
            
            document.getElementById('subtab-btn-chars').className = type === 'chars'
                ? 'px-4 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950'
                : 'px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-300';
            document.getElementById('subtab-btn-skills').className = type === 'skills'
                ? 'px-4 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950'
                : 'px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-300';
        }

        function filterCodex() {
            renderCodex();
        }

        function renderCodex() {
            const query = document.getElementById('codex-search').value.toLowerCase();
            
            const charGrid = document.getElementById('codex-chars-grid');
            charGrid.innerHTML = '';
            RAW_CHARACTERS
                .filter(c => c.name.toLowerCase().includes(query) || c.role.toLowerCase().includes(query) || c.skillName.toLowerCase().includes(query))
                .forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 text-xs hover:border-amber-500/50 transition';
                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span class="font-bold text-sm text-slate-100">${c.name}</span>
                            <span class="px-2 py-0.5 rounded bg-blue-900/50 border border-blue-700 text-blue-300 font-semibold">${c.role}</span>
                        </div>
                        <div class="grid grid-cols-4 gap-1 text-center font-mono py-1 bg-slate-800/50 rounded">
                            <div><span class="text-slate-500 block text-[10px]">物攻</span><span class="text-amber-400 font-bold">${c.phy}</span></div>
                            <div><span class="text-slate-500 block text-[10px]">魔攻</span><span class="text-purple-400 font-bold">${c.mag}</span></div>
                            <div><span class="text-slate-500 block text-[10px]">防禦</span><span class="text-blue-400 font-bold">${c.def}</span></div>
                            <div><span class="text-slate-500 block text-[10px]">速度</span><span class="text-emerald-400 font-bold">${c.spd}</span></div>
                        </div>
                        <div>
                            <span class="text-slate-400 font-semibold block text-[11px]">天生招式：<span class="text-amber-300">${c.skillName}</span> (${c.skillType})</span>
                            <p class="text-slate-300 mt-1 leading-relaxed">${c.skillDesc || '無特殊描述'}</p>
                            ${c.hasCC === '是' ? `<p class="text-red-400 mt-1 font-semibold">控制/附加：${c.ccDesc}</p>` : ''}
                        </div>
                    `;
                    charGrid.appendChild(card);
                });

            const skillGrid = document.getElementById('codex-skills-grid');
            skillGrid.innerHTML = '';
            RAW_SKILLS
                .filter(s => s.name.toLowerCase().includes(query) || s.trigger.toLowerCase().includes(query))
                .forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 text-xs hover:border-amber-500/50 transition';
                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span class="font-bold text-sm text-amber-300">${s.name}</span>
                            <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-semibold">${s.trigger}</span>
                        </div>
                        <p class="text-slate-300 leading-relaxed">${s.desc}</p>
                    `;
                    skillGrid.appendChild(card);
                });
        }
    </script>
</body>
</html>
